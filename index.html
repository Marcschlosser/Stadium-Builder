<!DOCTYPE html>
<html>
    <head>
        <title>Stadium Builder</title>
        <style>
            body {
                background-color: #2e7d32;
                font-family: Arial, sans-serif;
                color: white;
                padding: 20px;
            }
            h1 {
            text-align: center;
            }
            p {
                background-color: #1b5e20;
                padding: 10px 14px;
                border-radius: 8px;
                max-width: 400px;
            }
            button {
                background-color: #fdd835;
                border: none;
                padding: 10px 14px;
                margin: 8px;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
            }
            button:hover {
                background-color: #f9a825;
            }
        </style>
         </head>
         <body>
            <h1>Stadium Builder</h1>
            <p>Money: $<span id="money">1000</span></p>
            <p>Hot dog stands: <span id="stands">0</span></p>
            <p> Team rating: <span id="rating">50</span></p>
            <p>Parking lots: <span id="parkingLots">0</span></p> 
            <p>Seat level: <span id="seatLevel">0</span></p>
            <p>Ticket price: <span id="price">5</span></p> 
            <p>Last game attendance: <span id="attendance">0</span></p> 
            <p>Last game Profit: $<span id="profit">0</span></p>
            <p>Your stadium: <span id="field"></span></p>
            <p>Your parking: <span id="lotsField"></span></p>
            <p>Your seats: <span id="seatsField"></span></p>
            <p>Message: <span id="message"></span></p>


             
            <button onclick="buyStand()">Buy Hot Dog Stand ($200)</button>
            <button onclick="playGame()">Play a Game</button>
            <button id="hireBtn" onclick="hirePlayer()">Hire Better Player ($300)</button>
            <button onclick="buyParkingLot()">Buy Parking Lot ($500)</button> 
            <button onclick="buySeatUpgrade()">Buy Seat Upgrade ($400)</button>
            <button onclick="changePrice(1)">Raise ticket Price</button>
            <button onclick="changePrice(-1)">Lower Ticket Price</button>


            <script>
                let money = 1000;
                let stands = 0;
                let rating = 50;
                let hireCost = 300;
                let parkingLots = 0;
                let seatLevel = 0;
                let ticketPrice =5;   
                

             function buyStand() {
             if (money >= 200) {
             money = money - 200;
             stands = stands + 1;

            document.getElementById("money").textContent = money;
           document.getElementById("stands").textContent = stands;
           document.getElementById("field").textContent = "🌭".repeat(stands);
           document.getElementById("message").textContent = "Hot dog stand bought!";
             } else {
                document.getElementById("message").textContent = "Not enough money for a hot dog stand";
        }        
}
                
                    
                
                  function playGame() {
                    let attendance = Math.max(0, rating *2 - ticketPrice * 10);
                    let ticketMoney = attendance * ticketPrice;
                    let bonus = stands *25; 
                    let seatBonus = seatLevel * 40;
                    let parkingMoney = parkingLots * 60;
                    let income = ticketMoney + bonus + seatBonus + parkingMoney;
                    let result = "";
                    if (Math.random() < rating / 100){
                        income = income + 300;
                        result = "You WON!";
                    } else {
                        income = income + 50;
                        result = "You LOST!";
                    }

                    if (Math.random() < rating / 100){
                        income = income + 300;
                    }  else {
                        income = income + 50;
                    }
                    let costs = 100 + stands * 5 + parkingLots * 10;
                    let profit = income - costs;
                    money = money + profit;

                    document.getElementById("money").textContent = money;
                    document.getElementById("attendance").textContent = attendance;
                    document.getElementById("profit").textContent = profit;
                    document.getElementById("message").textContent = result + "Profit: $" + profit;
                    }
               
                  function hirePlayer() {
                    if (money >= hireCost && rating < 100){
                    money = money - hireCost;
                    rating = rating + 5;
                    hireCost = hireCost + 100;
                    

                    document.getElementById("money").textContent = money;
                    document.getElementById("rating").textContent = rating;
                    document.getElementById("hireBtn").textContent = "Hire better Player ($" + hireCost + ")";
                    document.getElementById("message").textContent = "Better Player Bought";
                  } else {
                    document.getElementById("message").textContent = "Not enough money for a better player";
                  }
                }
                function buyParkingLot() {
                    if (money >= 500){
                       money = money - 500;
                       parkingLots = parkingLots + 1;
                    document.getElementById("money").textContent = money;
                    document.getElementById("parkingLots").textContent = parkingLots;
                    document.getElementById("lotsField").textContent = "🅿️".repeat(parkingLots);
                    document.getElementById("message").textContent = "Parking lot bought";
                    } else {
                        document.getElementById("message").textContent = "Not enough money for a parking lot";    
                }

                }

                function buySeatUpgrade(){
                    if (money >= 400 && seatLevel < 5) {
                        money = money - 400;
                        seatLevel = seatLevel + 1;
                        document.getElementById("money").textContent = money;
                        document.getElementById("seatLevel").textContent = seatLevel;
                        document.getElementById("seatsField").textContent = "💺".repeat(seatLevel);
                        document.getElementById("message").textContent = "Seat upgrade bought";
                    } else {
                        document.getElementById("message").textContent = "Not enought money for a seat upgrade";
                    }
                }
                function changePrice(amount) {
                    ticketPrice = ticketPrice + amount;

                    if (ticketPrice < 1) {
                        ticketPrice =1;
                    }
                    document.getElementById("price").textContent = ticketPrice;
                }

       
                
            </script>
        
        </body>
</html>
